# Verify the locked application stack; PHP 8.5 compatibility runs only on main.
name: CI

on:
  pull_request:
  push:
    branches: [staging, main]
  workflow_dispatch:

# Verification requires repository read access and no application secrets.
permissions:
  contents: read

# Replace obsolete runs without allowing a PR run to cancel a branch push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-84:
    name: Backend — PHP 8.4
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Select the runtime independently of Composer's PHP 8.4 resolution baseline.
      PHP_VERSION: '8.4'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      # Opt in to guarded real-service tests; never silently skip integrations.
      RUN_DOCKER_TESTS: '1'
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    # Each job receives fresh services, using the same image pins as local tests.
    services: &backend-services
      postgres-test:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_DB: signalbox_test
          POSTGRES_USER: signalbox_test
          POSTGRES_PASSWORD: signalbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalbox_test -d signalbox_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis-test:
        image: redis:7-bookworm@sha256:4fa24486b8bcca8eec45ee0eb166edc674795e53a2b53d1a9ef263eecebaac85
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    # Aliases keep both PHP jobs' checks identical without another workflow.
    steps: &backend-steps
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, pcntl, pdo_pgsql, posix, intl, zip, mbstring
          tools: composer:2.10.2
          coverage: none
      - name: Validate Composer manifest and lock
        run: composer validate --strict --no-check-publish
      - name: Locate Composer download cache
        id: composer-cache
        run: echo "path=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ runner.arch }}-${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - name: Install locked PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check actual PHP and extension requirements
        run: composer check-platform-reqs
      - name: Check PHP formatting without changes
        run: composer format:check -- --sequential
      - name: Analyse PHP with Larastan level 8
        run: composer analyse -- --debug
      - name: Run all Pest suites without skipped tests
        run: composer test -- --fail-on-skipped

  backend-85:
    name: Backend — PHP 8.5
    # A PR targeting main has a pull ref and must not run compatibility checks.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Match PHP 8.4's isolated environment while selecting the newer runtime.
      PHP_VERSION: '8.5'
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      RUN_DOCKER_TESTS: '1'
      DB_HOST: 127.0.0.1
      REDIS_HOST: 127.0.0.1
    services: *backend-services
    steps: *backend-steps

  frontend:
    name: Frontend — Node 22
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node and npm download cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Select the recorded npm version
        run: npm install --global npm@10.9.8
      - name: Install locked frontend dependencies with strict peers
        run: npm ci --ignore-scripts --strict-peer-deps
      - name: Lint frontend and tooling without warnings
        run: npm run lint
      - name: Check frontend formatting without changes
        run: npm run format:check
      - name: Check strict TypeScript types
        run: npm run types:check
      - name: Test quality-tool configuration
        run: npm run test:quality
      - name: Test React DOM and keyboard interactions
        run: npm test
      - name: Build production frontend assets
        run: npm run build
